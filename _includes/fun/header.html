<header class="header">
  <div class="container">
    <marquee behavior="scroll" direction="left" class="welcome-marquee">
      ⭐ Welcome to Holly's AWESOME English Class Zone! ⭐ 🐱 Learn English the FUN way! 🐱 ✨ You've found the coolest corner of the internet! ✨
    </marquee>

    <div class="header-content">
      <a href="{{ '/fun/' | relative_url }}" class="logo">
        <span class="logo-text">~*Holly Richmond*~</span>
        <span class="logo-subtitle">English Teacher Extraordinaire!</span>
      </a>

      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span>MENU</span>
      </button>

      <nav class="nav" role="navigation">
        <ul class="nav-list">
          {% for item in site.data.navigation.fun %}
          <li class="nav-item">
            <a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
              {{ item.title }}
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</header>

<script>
  document.querySelector('.nav-toggle').addEventListener('click', function() {
    const nav = document.querySelector('.nav');
    const isExpanded = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', !isExpanded);
    nav.classList.toggle('nav--open');
  });
</script>
