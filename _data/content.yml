# Student Stories
stories:
  title: "Student Stories"
  items:
    - title: "Student Story #1"
      goal:
        title: "My student's goal"
        text: |
          My student, J., had a typical English learning experience that many engineers who speak other languages have. He had studied it since high school, but didn't have much speaking experience outside of work. He wanted to feel more comfortable speaking English in critical design reviews and in meetings with international clients/stakeholders. To start out, I asked him approximately 2 billion questions (just kidding, but it was a lot) about his job, his everyday tasks, his designs, programs he uses, problems he faces at work, his interests, etc.
      method:
        title: "How we work to reach it"
        text: |
          Just by explaining aspects of his job and interests, he was practicing formulating sentences and phrases he hadn't used before. He was able to use and improve natural ways of speaking from the start. I like to challenge my students, but not so much that they feel overwhelmed. I mix activities such as oral translations and role plays (more challenging) with discussions about students' interests (easier, motivating). During our classes, we explore work related topics (satellites, programming) as well as topics about technology or his interests. Basically, he learns to speak more fluently by teaching me about his areas of expertise!
      correction:
        title: "Correcting speaking errors"
        text: |
          Because my classes focus on fluency, I don't interrupt my students' speaking to correct minor mistakes. I take notes during the class and share them at the end. If I notice a repeated error, we'll practice it next class. If my student makes a mistake that makes it hard for me to understand what they're saying, we will stop and work together to find a clear way to express what they want to. My goal for my students is not for them to have perfect grammar and pronunciation. Not even native speakers have that. My students form their own goals and then I use my teaching expertise to collaborate with them to reach those goals.
      results:
        title: "Results"
        text: |
          The advantage of personalized/specialized classes is that you can speak about specifics that you encounter at work. It might be hard to find a general English class that teaches you to speak in just the way you need to. Nowadays, J feels more comfortable and confident answering questions and speaking up in meetings. I'm very proud of his progress. If your experience with English sounds similar to J's, feel free to write me! I'd be happy to help you improve in the same way.

    - title: "Student Story #2"
      goal:
        title: "My student's goal"
        text: |
          My student, A., is a mechanical engineer. He lived in London for a year after graduating from University and gained a lot of fluency there. However, once he moved back to Spain and started his career, his English got rusty. Some years later, he lost out on a job opportunity because his English level was lower than the other candidate's. After that, he contacted me and we started working together. Our first priority was to practice English for interviews, so we did role plays of interviews. He practiced talking about himself and his strengths and weaknesses.
      method:
        title: "How we work to reach it"
        text: |
          In addition to practicing for interviews, I had A. show and tell me about really interesting designs he had made for farming, building, and transportation applications. My students' work is so fascinating. When we're not talking about engineering/design or reviewing specific grammar that he needs to practice, we like to talk about movies, series, travel, basketball, etc. Since we started classes almost two years ago, A. has worked in two different companies where he feels comfortable and confident speaking English in interviews and meetings. We still have weekly classes so he stays fluent.
      correction:
        title: "Correcting speaking errors"
        text: |
          Because my classes focus on fluency, I don't interrupt my students' speaking to correct minor mistakes. I take notes during the class and share them at the end. If I notice a repeated error, we'll practice it next class. If my student makes a mistake that makes it hard for me to understand what they're saying, we will stop and work together to find a clear way to express what they want to. My goal for my students is not for them to have perfect grammar and pronunciation. Not even native speakers have that. My students form their own goals and then I use my teaching expertise to collaborate with them to reach those goals.
      results:
        title: "Results"
        text: |
          The advantage of personalized/specialized classes is that you can speak about specifics that you encounter at work. It might be hard to find a general English class that teaches you to speak in just the way you need to. Nowadays, A. feels more better about doing interviews in English and speaking up in meetings. I'm very proud of his progress. If your experience with English sounds similar to A's, feel free to write me! I'd be happy to help you improve in the same way.

